{% extends './shared/_MainLayout.html' %}
{% load static %}
<!--Stylesheet-->
<style media="screen">
    *,
    *:before,
    *:after {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
    }

    body {
        background-color: #080710;
    }

    .background {
        width: 530px;
        height: 620px;
        position: absolute;
        transform: translate(-50%, -50%);
        left: 50%;
        top: 50%;
    }

    .background .shape {
        height: 170px;
        width: 170px;
        position: absolute;
        border-radius: 50%;
    }

    .shape:first-child {
        background: linear-gradient(
                #1845ad,
                #23a2f6
        );
        left: -80px;
        top: -80px;
    }

    .shape:last-child {
        background: linear-gradient(
                to right,
                #ff512f,
                #f09819
        );
        right: -30px;
        bottom: -80px;
    }

    form {
        height: 600px;
        width: 480px;
        background-color: rgba(255, 255, 255, 0.13);
        position: absolute;
        transform: translate(-50%, -50%);
        top: 50%;
        left: 50%;
        border-radius: 10px;
        backdrop-filter: blur(10px);
        border: 2px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 0 40px rgba(8, 7, 16, 0.6);
        padding: 50px 35px;
    }

    form * {
        font-family: 'Poppins', sans-serif;
        color: #ffffff;
        letter-spacing: 0.5px;
        outline: none;
        border: none;
    }

    form h3 {
        font-size: 32px;
        font-weight: 500;
        line-height: 1px;
        text-align: center;
        font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
    }

    label {
        display: block;
        margin-top: 20px;
        font-size: 20px;
        font-weight: 500;
        text-align: right;
    }

    input {
        display: block;
        height: 50px;
        width: 100%;
        background-color: rgba(255, 255, 255, 0.07);
        border-radius: 3px;
        padding: 0 10px;
        margin-top: 8px;
        font-size: 14px;
        font-weight: 300;
    }

    ::placeholder {
        color: #e5e5e5;
        text-align: right;
    }

    button {
        float: left;
        margin-top: 15px;
        margin-left: 5px;
        width: 48%;
        background-color: #ffffff;
        color: #080710;
        padding: 10px 5px;
        font-size: 18px;
        font-weight: 600;
        border-radius: 5px;
        cursor: pointer;
    }

    .social {
        margin-top: 30px;
        display: flex;
    }

    .social div {
        background: red;
        width: 150px;
        border-radius: 3px;
        padding: 5px 10px 10px 5px;
        background-color: rgba(255, 255, 255, 0.27);
        color: #eaf0fb;
        text-align: center;
    }

    .social div:hover {
        background-color: rgba(255, 255, 255, 0.47);
    }

    .social .fb {
        margin-left: 25px;
    }

    .social i {
        margin-right: 4px;
    }

</style>
{% block content %}
    <body>
    <div class="background">
        <div class="shape"></div>
        <div class="shape"></div>
    </div>
    <form class="col-md-12">
        <h3>صندوق خانگی سادات</h3>

        <label for="username" style="margin-top: 40px;"> نام و نام خانوادگی</label>
        <input type="text" placeholder="نام , نام خانوادگی خود را وارد نمائید" id="username">
        <label for="phone number">شماره موبایل </label>
        <input type="text" placeholder="شماره موبایل خود را وارد نمائید" id="phone number">
        <div class="col-md-6">
            <label for="password">کلمه عبور</label>
            <input type="password" placeholder="کلمه عبور خود را وارد نمائید" id="password">
        </div>
        <div class="col-md-6">
            <label for="repassword">تکرار رمز عبور</label>
            <input type="password" placeholder="کلمه عبور را مجدد وارد نمائید" id="repassword">
        </div>
        <button>ثبت نام</button>
        <button>من قبلا ثبت نام کرده ام</button>
    </form>
    </body>

{% endblock %}
